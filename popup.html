<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VIT Feedback Filler</title>
  <style>
    /* ── Reset & base ───────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black:   #000000;
      --yellow:  #FFDD00;
      --cream:   #FFFBE6;
      --white:   #FFFFFF;
      --green:   #00CC44;
      --red:     #FF3333;
      --blue:    #1A6EFF;
      --shadow:  4px 4px 0 var(--black);
      --shadow-s: 2px 2px 0 var(--black);
    }

    body {
      width: 320px;
      background: var(--cream);
      font-family: 'Courier New', Courier, monospace;
      color: var(--black);
      border: 3px solid var(--black);
    }

    /* ── Header ─────────────────────────────────────────── */
    .header {
      background: var(--yellow);
      border-bottom: 3px solid var(--black);
      padding: 12px 14px 10px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header-icon { font-size: 24px; flex-shrink: 0; }
    .header-text { flex: 1; }
    .header-title {
      font-size: 15px;
      font-weight: 900;
      letter-spacing: -0.3px;
      line-height: 1;
    }
    .header-sub {
      font-size: 10px;
      color: #444;
      margin-top: 2px;
      font-weight: 700;
    }
    .scan-btn {
      background: var(--black);
      color: var(--yellow);
      border: 2px solid var(--black);
      padding: 5px 10px;
      font-family: inherit;
      font-size: 11px;
      font-weight: 900;
      cursor: pointer;
      letter-spacing: 0.5px;
      transition: transform 0.1s, box-shadow 0.1s;
      box-shadow: var(--shadow-s);
    }
    .scan-btn:hover  { transform: translate(-1px,-1px); box-shadow: 3px 3px 0 #555; }
    .scan-btn:active { transform: translate(2px,2px);   box-shadow: none; }

    /* ── Status pill ─────────────────────────────────────── */
    .pill {
      border-bottom: 3px solid var(--black);
      padding: 7px 14px;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .pill-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      border: 1.5px solid var(--black);
      flex-shrink: 0;
    }
    .pill.grey   { background: #e5e5e5; }
    .pill.yellow { background: #fff9cc; }
    .pill.green  { background: #d4f5d4; }
    .pill.blue   { background: #d0e8ff; }
    .pill.red    { background: #ffe0e0; }
    .dot-grey   { background: #aaa; }
    .dot-yellow { background: #ccaa00; }
    .dot-green  { background: var(--green); }
    .dot-blue   { background: var(--blue); }
    .dot-red    { background: var(--red); }

    /* ── Stats row ───────────────────────────────────────── */
    .stats {
      display: flex;
      border-bottom: 3px solid var(--black);
    }
    .stat-cell {
      flex: 1;
      padding: 8px 6px;
      text-align: center;
      border-right: 2px solid var(--black);
      background: var(--white);
    }
    .stat-cell:last-child { border-right: none; }
    .stat-val { font-size: 18px; font-weight: 900; line-height: 1; }
    .stat-lbl { font-size: 9px; color: #555; margin-top: 2px; font-weight: 700; }

    /* ── Section body ────────────────────────────────────── */
    .body { padding: 12px 14px; display: flex; flex-direction: column; gap: 12px; }

    /* ── Expandable rows ─────────────────────────────────── */
    .expand-row {
      border: 2px solid var(--black);
      box-shadow: var(--shadow-s);
      background: var(--white);
    }
    .expand-head {
      display: flex;
      align-items: center;
      padding: 9px 12px;
      cursor: pointer;
      user-select: none;
      font-weight: 900;
      font-size: 12px;
      letter-spacing: 0.3px;
    }
    .expand-head:hover { background: #f5f5f5; }
    .expand-label { flex: 1; }
    .expand-val {
      font-size: 10px;
      font-weight: 700;
      color: #555;
      background: var(--cream);
      border: 1.5px solid #ccc;
      padding: 2px 8px;
      margin-right: 8px;
    }
    .expand-chevron { font-size: 14px; line-height: 1; }
    .expand-panel {
      border-top: 2px solid var(--black);
      padding: 10px 12px;
      display: none;
      background: var(--cream);
    }
    .expand-panel.open { display: block; }

    /* ── Star chips ──────────────────────────────────────── */
    .chip-row { display: flex; gap: 6px; flex-wrap: wrap; }
    .chip {
      border: 2px solid var(--black);
      box-shadow: var(--shadow-s);
      padding: 5px 10px;
      font-size: 11px;
      font-weight: 900;
      cursor: pointer;
      background: var(--white);
      font-family: inherit;
      transition: transform 0.1s, box-shadow 0.1s;
      letter-spacing: 0.3px;
    }
    .chip:hover  { transform: translate(-1px,-1px); box-shadow: 3px 3px 0 #000; }
    .chip:active { transform: translate(2px,2px);   box-shadow: none; }
    .chip.active {
      background: var(--yellow);
      box-shadow: var(--shadow-s);
    }

    /* ── Textarea ─────────────────────────────────────────── */
    .custom-ta {
      width: 100%;
      border: 2px solid var(--black);
      padding: 8px;
      font-family: inherit;
      font-size: 11px;
      resize: vertical;
      min-height: 60px;
      margin-top: 8px;
      background: var(--white);
      display: none;
    }
    .custom-ta.show { display: block; }
    .char-hint { font-size: 9px; color: #888; text-align: right; margin-top: 3px; }

    /* ── Action buttons ──────────────────────────────────── */
    .btn-row { display: flex; gap: 8px; }
    .action-btn {
      flex: 1; padding: 11px 8px;
      border: 2px solid var(--black);
      box-shadow: var(--shadow);
      font-family: inherit;
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
      letter-spacing: 0.5px;
      background: var(--white);
      transition: transform 0.1s, box-shadow 0.1s;
      text-align: center;
    }
    .action-btn:hover  { transform: translate(-2px,-2px); box-shadow: 6px 6px 0 #000; }
    .action-btn:active { transform: translate(4px,4px);   box-shadow: none; }
    .action-btn:disabled {
      opacity: 0.45; cursor: not-allowed;
      transform: none !important; box-shadow: var(--shadow) !important;
    }
    .action-btn.primary { background: var(--yellow); }
    .action-btn.green-btn { background: var(--green); color: var(--white); }

    /* ── Loader ───────────────────────────────────────────── */
    .loader {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: var(--white);
      border: 2px solid var(--black);
      box-shadow: var(--shadow-s);
      font-size: 11px;
      font-weight: 700;
    }
    .loader.show { display: flex; }
    .spinner {
      width: 14px; height: 14px;
      border: 2px solid var(--black);
      border-top-color: var(--yellow);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Status box ───────────────────────────────────────── */
    .status-box {
      display: none;
      padding: 10px 12px;
      border: 2px solid var(--black);
      box-shadow: var(--shadow-s);
      font-size: 11px;
      font-weight: 700;
      white-space: pre-wrap;
      line-height: 1.5;
    }
    .status-box.show { display: block; }
    .status-box.ok   { background: #d4f5d4; }
    .status-box.warn { background: #fff3cd; }
    .status-box.err  { background: #ffe0e0; }

    /* ── Footer ───────────────────────────────────────────── */
    .footer {
      border-top: 3px solid var(--black);
      padding: 6px 14px;
      font-size: 9px;
      color: #777;
      background: #f5f5f5;
      text-align: center;
      font-weight: 700;
      letter-spacing: 0.3px;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="header-icon">⭐</div>
    <div class="header-text">
      <div class="header-title">VIT FEEDBACK FILLER</div>
      <div class="header-sub">VTOP End-Semester · Never Auto-Submits</div>
    </div>
    <button class="scan-btn" id="scanBtn" title="Re-scan page">↺ SCAN</button>
  </header>

  <!-- Status pill -->
  <div class="pill grey" id="pill">
    <div class="pill-dot dot-grey" id="pillDot"></div>
    <span id="pillText">Scanning page…</span>
  </div>

  <!-- Quick stats -->
  <div class="stats">
    <div class="stat-cell">
      <div class="stat-val" id="statQ">—</div>
      <div class="stat-lbl">QUESTIONS</div>
    </div>
    <div class="stat-cell">
      <div class="stat-val" id="statR">—</div>
      <div class="stat-lbl">RATING</div>
    </div>
    <div class="stat-cell">
      <div class="stat-val" id="statP">—</div>
      <div class="stat-lbl">PENDING</div>
    </div>
  </div>

  <!-- Main body -->
  <div class="body">

    <!-- Rating selector -->
    <div class="expand-row">
      <div class="expand-head" id="ratingHead">
        <span class="expand-label">⭐ STAR RATING</span>
        <span class="expand-val" id="ratingVal">5 Stars</span>
        <span class="expand-chevron" id="ratingChev">›</span>
      </div>
      <div class="expand-panel" id="ratingPanel">
        <div class="chip-row">
          <button class="chip" data-v="1">1★</button>
          <button class="chip" data-v="2">2★★</button>
          <button class="chip" data-v="3">3★★★</button>
          <button class="chip" data-v="4">4★★★★</button>
          <button class="chip active" data-v="5">5★★★★★</button>
        </div>
      </div>
    </div>

    <!-- Comment selector -->
    <div class="expand-row">
      <div class="expand-head" id="commentHead">
        <span class="expand-label">💬 COMMENT</span>
        <span class="expand-val" id="commentVal">None</span>
        <span class="expand-chevron" id="commentChev">›</span>
      </div>
      <div class="expand-panel" id="commentPanel">
        <div class="chip-row">
          <button class="chip active" data-c="">None</button>
          <button class="chip" data-c="Good">Good</button>
          <button class="chip" data-c="Excellent">Excellent</button>
          <button class="chip" data-c="Very Good">Very Good</button>
          <button class="chip" data-c="Satisfactory">Satisfactory</button>
          <button class="chip" data-c="__custom__">Custom…</button>
        </div>
        <textarea class="custom-ta" id="customTa" maxlength="250" placeholder="Type your comment here…"></textarea>
        <div class="char-hint" id="charHint">0 / 250</div>
      </div>
    </div>

    <!-- Loader -->
    <div class="loader" id="loader">
      <div class="spinner"></div>
      <span id="loaderText">Working…</span>
    </div>

    <!-- Status message -->
    <div class="status-box" id="statusBox">
      <span id="statusText"></span>
    </div>

    <!-- Action buttons -->
    <div class="btn-row">
      <button class="action-btn primary" id="fillBtn">⚡ AUTO-FILL</button>
      <button class="action-btn" id="batchBtn">🚀 BATCH FILL</button>
    </div>

  </div>

  <!-- Footer -->
  <footer class="footer">
    YOU CONTROL THE FINAL SUBMIT · FEEDBACK AFFECTS FFCS REGISTRATION
  </footer>

  <script src="popup.js"></script>
</body>
</html>
