<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VTOP Feedback Filler</title>
  <style>
    /* ── Reset ──────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink:      #000000;
      --accent:   #FFDD00;
      --bg-base:  #FFFBE6;
      --bg-card:  #FFFFFF;
      --ok:       #00CC44;
      --danger:   #FF3333;
      --info:     #1A6EFF;
      --drop-lg:  4px 4px 0 var(--ink);
      --drop-sm:  2px 2px 0 var(--ink);
    }

    body {
      width: 320px;
      background: var(--bg-base);
      font-family: 'Courier New', Courier, monospace;
      color: var(--ink);
      border: 3px solid var(--ink);
    }

    /* ── Top bar ────────────────────────────────────────── */
    .top-bar {
      background: var(--accent);
      border-bottom: 3px solid var(--ink);
      padding: 12px 14px 10px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-icon { font-size: 24px; flex-shrink: 0; }
    .brand-text { flex: 1; }
    .brand-title {
      font-size: 15px;
      font-weight: 900;
      letter-spacing: -0.3px;
      line-height: 1;
    }
    .brand-sub {
      font-size: 10px;
      color: #444;
      margin-top: 2px;
      font-weight: 700;
    }
    .rescan-btn {
      background: var(--ink);
      color: var(--accent);
      border: 2px solid var(--ink);
      padding: 5px 10px;
      font-family: inherit;
      font-size: 11px;
      font-weight: 900;
      cursor: pointer;
      letter-spacing: 0.5px;
      transition: transform 0.1s, box-shadow 0.1s;
      box-shadow: var(--drop-sm);
    }
    .rescan-btn:hover  { transform: translate(-1px,-1px); box-shadow: 3px 3px 0 #555; }
    .rescan-btn:active { transform: translate(2px,2px);   box-shadow: none; }

    /* ── Status strip ───────────────────────────────────── */
    .status-strip {
      border-bottom: 3px solid var(--ink);
      padding: 7px 14px;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .strip-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      border: 1.5px solid var(--ink);
      flex-shrink: 0;
    }
    .status-strip.s-grey   { background: #e5e5e5; }
    .status-strip.s-yellow { background: #fff9cc; }
    .status-strip.s-green  { background: #d4f5d4; }
    .status-strip.s-blue   { background: #d0e8ff; }
    .status-strip.s-red    { background: #ffe0e0; }
    .dot-grey   { background: #aaa; }
    .dot-yellow { background: #ccaa00; }
    .dot-green  { background: var(--ok); }
    .dot-blue   { background: var(--info); }
    .dot-red    { background: var(--danger); }

    /* ── Controls area ──────────────────────────────────── */
    .controls { padding: 12px 14px; display: flex; flex-direction: column; gap: 12px; }

    /* ── Setting blocks (expandable) ────────────────────── */
    .setting-block {
      border: 2px solid var(--ink);
      box-shadow: var(--drop-sm);
      background: var(--bg-card);
    }
    .setting-toggle {
      display: flex;
      align-items: center;
      padding: 9px 12px;
      cursor: pointer;
      user-select: none;
      font-weight: 900;
      font-size: 12px;
      letter-spacing: 0.3px;
    }
    .setting-toggle:hover { background: #f5f5f5; }
    .setting-label { flex: 1; }
    .setting-badge {
      font-size: 10px;
      font-weight: 700;
      color: #555;
      background: var(--bg-base);
      border: 1.5px solid #ccc;
      padding: 2px 8px;
      margin-right: 8px;
    }
    .toggle-arrow { font-size: 14px; line-height: 1; }
    .setting-drawer {
      border-top: 2px solid var(--ink);
      padding: 10px 12px;
      display: none;
      background: var(--bg-base);
    }
    .setting-drawer.open { display: block; }

    /* ── Badges (star/comment chips) ────────────────────── */
    .badge-row { display: flex; gap: 6px; flex-wrap: wrap; }
    .badge {
      border: 2px solid var(--ink);
      box-shadow: var(--drop-sm);
      padding: 5px 10px;
      font-size: 11px;
      font-weight: 900;
      cursor: pointer;
      background: var(--bg-card);
      font-family: inherit;
      transition: transform 0.1s, box-shadow 0.1s;
      letter-spacing: 0.3px;
    }
    .badge:hover  { transform: translate(-1px,-1px); box-shadow: 3px 3px 0 #000; }
    .badge:active { transform: translate(2px,2px);   box-shadow: none; }
    .badge.active {
      background: var(--accent);
      box-shadow: var(--drop-sm);
    }

    /* ── Note textarea ──────────────────────────────────── */
    .note-input {
      width: 100%;
      border: 2px solid var(--ink);
      padding: 8px;
      font-family: inherit;
      font-size: 11px;
      resize: vertical;
      min-height: 60px;
      margin-top: 8px;
      background: var(--bg-card);
      display: none;
    }
    .note-input.show { display: block; }
    .char-counter { font-size: 9px; color: #888; text-align: right; margin-top: 3px; }

    /* ── Action buttons ─────────────────────────────────── */
    .action-row { display: flex; gap: 8px; }
    .run-btn {
      flex: 1; padding: 11px 8px;
      border: 2px solid var(--ink);
      box-shadow: var(--drop-lg);
      font-family: inherit;
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
      letter-spacing: 0.5px;
      background: var(--bg-card);
      transition: transform 0.1s, box-shadow 0.1s;
      text-align: center;
    }
    .run-btn:hover  { transform: translate(-2px,-2px); box-shadow: 6px 6px 0 #000; }
    .run-btn:active { transform: translate(4px,4px);   box-shadow: none; }
    .run-btn:disabled {
      opacity: 0.45; cursor: not-allowed;
      transform: none !important; box-shadow: var(--drop-lg) !important;
    }
    .run-btn.primary { background: var(--accent); }
    .run-btn.go-btn  { background: var(--ok); color: var(--bg-card); }
    .run-btn.snorlax { width: 100%; background: #3D7A8A; color: var(--bg-card); }
    .run-btn.snorlax.primary { background: #2A5C69; }
    .btn-hint { display: block; font-size: 9px; font-weight: 700; margin-top: 2px; letter-spacing: 0; opacity: 0.85; }

    /* ── Busy bar ───────────────────────────────────────── */
    .busy-bar {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: var(--bg-card);
      border: 2px solid var(--ink);
      box-shadow: var(--drop-sm);
      font-size: 11px;
      font-weight: 700;
    }
    .busy-bar.show { display: flex; }
    .spin-ring {
      width: 14px; height: 14px;
      border: 2px solid var(--ink);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Message box ────────────────────────────────────── */
    .msg-box {
      display: none;
      padding: 10px 12px;
      border: 2px solid var(--ink);
      box-shadow: var(--drop-sm);
      font-size: 11px;
      font-weight: 700;
      white-space: pre-wrap;
      line-height: 1.5;
    }
    .msg-box.show      { display: block; }
    .msg-box.ok        { background: #d4f5d4; }
    .msg-box.warn      { background: #fff3cd; }
    .msg-box.err       { background: #ffe0e0; }

    /* ── Summary row ────────────────────────────────────── */
    .summary-row {
      display: flex;
      border-top: 3px solid var(--ink);
    }
    .summary-cell {
      flex: 1;
      padding: 8px 6px;
      text-align: center;
      border-right: 2px solid var(--ink);
      background: var(--bg-card);
    }
    .summary-cell:last-child { border-right: none; }
    .cell-val { font-size: 18px; font-weight: 900; line-height: 1; }
    .cell-lbl { font-size: 9px; color: #555; margin-top: 2px; font-weight: 700; }

    /* ── Footer ─────────────────────────────────────────── */
    .foot-note {
      border-top: 3px solid var(--ink);
      padding: 6px 14px;
      font-size: 9px;
      color: #777;
      background: #f5f5f5;
      text-align: center;
      font-weight: 700;
      letter-spacing: 0.3px;
    }
  </style>
</head>
<body>

  <!-- Top bar -->
  <header class="top-bar">
    <div class="brand-icon">⭐</div>
    <div class="brand-text">
      <div class="brand-title">VTOP FEEDBACK FILLER</div>
      <div class="brand-sub">End-Semester · 3 Modes</div>
    </div>
    <button class="rescan-btn" id="scanBtn" title="Re-scan page">↺ SCAN</button>
  </header>

  <!-- Status strip -->
  <div class="status-strip s-grey" id="pill">
    <div class="strip-dot dot-grey" id="pillDot"></div>
    <span id="pillText">Scanning page…</span>
  </div>

  <!-- Controls -->
  <div class="controls">

    <!-- Rating selector -->
    <div class="setting-block">
      <div class="setting-toggle" id="ratingHead">
        <span class="setting-label">⭐ STAR RATING</span>
        <span class="setting-badge" id="ratingVal">3 Stars</span>
        <span class="toggle-arrow" id="ratingChev">›</span>
      </div>
      <div class="setting-drawer" id="ratingPanel">
        <div class="badge-row">
          <button class="badge" data-v="1">1★</button>
          <button class="badge" data-v="2">2★★</button>
          <button class="badge active" data-v="3">3★★★</button>
          <button class="badge" data-v="4">4★★★★</button>
          <button class="badge" data-v="5">5★★★★★</button>
        </div>
      </div>
    </div>

    <!-- Comment selector -->
    <div class="setting-block">
      <div class="setting-toggle" id="commentHead">
        <span class="setting-label">💬 COMMENT</span>
        <span class="setting-badge" id="commentVal">None</span>
        <span class="toggle-arrow" id="commentChev">›</span>
      </div>
      <div class="setting-drawer" id="commentPanel">
        <div class="badge-row">
          <button class="badge active" data-c="">None</button>
          <button class="badge" data-c="Good">Good</button>
          <button class="badge" data-c="Excellent">Excellent</button>
          <button class="badge" data-c="Very Good">Very Good</button>
          <button class="badge" data-c="Satisfactory">Satisfactory</button>
          <button class="badge" data-c="__custom__">Custom…</button>
        </div>
        <textarea class="note-input" id="customTa" maxlength="250" placeholder="Type your comment here…"></textarea>
        <div class="char-counter" id="charHint">0 / 250</div>
      </div>
    </div>

    <!-- Action buttons -->
    <div class="action-row">
      <button class="run-btn primary" id="fillBtn">⚡ AUTO-FILL</button>
      <button class="run-btn" id="batchBtn">🚀 BATCH FILL</button>
    </div>
    <button class="run-btn snorlax" id="snorlaxBtn">
      😴 SNORLAX
      <span class="btn-hint">Fill + submit everything in one go — no stops</span>
    </button>

    <!-- Busy indicator -->
    <div class="busy-bar" id="loader">
      <div class="spin-ring"></div>
      <span id="loaderText">Working…</span>
    </div>

    <!-- Result message -->
    <div class="msg-box" id="statusBox">
      <span id="statusText"></span>
    </div>

  </div>

  <!-- Summary row -->
  <div class="summary-row">
    <div class="summary-cell">
      <div class="cell-val" id="statQ">—</div>
      <div class="cell-lbl">QUESTIONS</div>
    </div>
    <div class="summary-cell">
      <div class="cell-val" id="statR">—</div>
      <div class="cell-lbl">RATING</div>
    </div>
    <div class="summary-cell">
      <div class="cell-val" id="statP">—</div>
      <div class="cell-lbl">PENDING</div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="foot-note">
    SNORLAX SUBMITS FOR YOU · FEEDBACK AFFECTS FFCS REGISTRATION
  </footer>

  <script src="popup.js"></script>
</body>
</html>
